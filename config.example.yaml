## relay 配置模板：复制为 config.yaml 后按实际环境修改
## 用法：./relay -config config.yaml

server:
  addr: ":8080"
  # 该地址即 OIDC issuer，会写进 id_token 的 iss 与 discovery 文档，必须与外部访问地址一致
  base_url: "http://localhost:8080"
  # 未登录访问 /oidc/authorize 时跳转到的登录页
  login_url: "/login"
  # 应用首次申请权限时的确认页
  consent_url: "/consent"
  # 登录完成后的用户中心
  account_url: "/"
  # 登录卡片顶部的品牌行，留空则整行隐藏
  site_title: "广州大学"
  # 按 sub 前缀匹配邮箱后缀，最长前缀优先；邮箱生成为 <sub>@<后缀>。
  # 键为空字符串时匹配所有 sub，可作兜底；删掉后未命中前缀的账号将无法创建
  email_domains:
    "3": "e.gzhu.edu.cn"
    "": "gzhu.edu.cn"
  # 首次启动自动生成 RS256 签名密钥，需持久化并纳入备份
  signing_key_path: "./data/signing_key.pem"
  # 应用图标目录，按 client_id 命名，需与数据库一起备份
  logo_dir: "./data/logos"
  # 只有来自这些地址的请求才采信 X-Forwarded-For，用于还原真实来访 IP。
  # 反向代理不在本机时把代理地址加进来；写成 [] 表示一律使用连接地址
  trusted_proxies:
    - "127.0.0.1"
    - "::1"
  # 登录页右侧的预留文案区，enabled 为 false 时登录卡片收成单栏
  login_panel:
    enabled: true
    title: "统一身份认证门户"
    body: "此处为预留说明区域，可在 config.yaml 的 server.login_panel 中修改文案，或将 enabled 设为 false 隐藏本区域。"
  # 登录页卡片下方的页脚，enabled 为 false 或 text 为空时不显示
  login_footer:
    enabled: true
    text: "© 广州大学"

# 32 字节密钥，base64 或 hex 编码，用于加密账号身份快照。可用 openssl rand -base64 32 生成
secret_key: ""

database:
  dsn: "postgres://relay:relay@localhost:5432/relay?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

upstream:
  cas_base_url: "https://newcas.gzhu.edu.cn"
  portal_base_url: "https://newmy.gzhu.edu.cn"
  timeout: 30s
  # 每次登录成功后按该概率异步回访上游，刷新资料快照与上游用户组；0 表示从不刷新
  refresh_rate: 0.1

# 登录通知邮件。host 留空时关闭该功能；配置后用户首次授权登录某个应用会收到邮件提醒，
# 撤销授权后重新授权也不会重复发送
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  # 发件人显示名，留空则只显示邮箱地址
  from_name: "统一身份认证"
  from: "noreply@gzhu.edu.cn"

# 极验行为验证。默认只在某个 IP 登录失败后，fail_window 内要求验证码；
# 期间任意一次登录成功即解除，直到下次失败重新要求验证
captcha:
  enabled: false
  # 始终要求验证：每次登录都要过验证码，且不再记录失败次数。
  # 开启后 fail_window 不再生效，适合对外网完全开放的部署
  always: false
  # 极验后台的验证 ID 与私钥，私钥只在服务端使用
  captcha_id: ""
  captcha_key: ""
  fail_window: 24h

# 可绑定的第三方账号来源。每个来源走标准 OAuth2 授权码流程，
# 只要对方支持 authorization code 就能在这里加一条，不需要改代码。
# id_field / name_field 指对方 userinfo 响应里用作账号标识与展示名的字段。
bindings:
  providers:
    - name: gitea
      display_name: Gitea
      client_id: ""
      client_secret: ""
      auth_url: "https://git.example.com/login/oauth/authorize"
      token_url: "https://git.example.com/login/oauth/access_token"
      userinfo_url: "https://git.example.com/api/v1/user"
      id_field: "login"
      name_field: "login"
