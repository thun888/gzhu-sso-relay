## relay 配置模板：复制为 config.yaml 后按实际环境修改
## 用法：./relay -config config.yaml

server:
  addr: ":8080"
  # 该地址即 OIDC issuer，会写进 id_token 的 iss 与 discovery 文档，必须与外部访问地址一致
  base_url: "http://localhost:8080"
  # 未登录访问 /oidc/authorize 时跳转到的登录页
  login_url: "/login"
  # 登录卡片顶部的品牌行，留空则整行隐藏
  site_title: "广州大学"
  # 按 sub 前缀匹配邮箱后缀，最长前缀优先；邮箱生成为 <sub>@<后缀>。
  # 键为空字符串时匹配所有 sub，可作兜底；删掉后未命中前缀的账号将无法创建
  email_domains:
    "3": "e.gzhu.edu.cn"
    "": "gzhu.edu.cn"
  # 首次启动自动生成 RS256 签名密钥，需持久化并纳入备份
  signing_key_path: "./data/signing_key.pem"
  # 登录页右侧的预留文案区，enabled 为 false 时登录卡片收成单栏
  login_panel:
    enabled: true
    title: "统一身份认证门户"
    body: "此处为预留说明区域，可在 config.yaml 的 server.login_panel 中修改文案，或将 enabled 设为 false 隐藏本区域。"

# 32 字节密钥，base64 或 hex 编码，用于加密上游令牌。可用 openssl rand -base64 32 生成
secret_key: ""

database:
  dsn: "postgres://relay:relay@localhost:5432/relay?sslmode=disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

upstream:
  cas_base_url: "https://newcas.gzhu.edu.cn"
  portal_base_url: "https://newmy.gzhu.edu.cn"
  timeout: 30s
